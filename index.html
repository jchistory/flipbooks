<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Flipbook Viewer</title>

    <style>
      body {
      margin: 0;
      padding: 20px;
      background: #f6f2ec;
      color: #333;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
       h1 {
      font-size: 24px;
    }

    #viewer {
      display: flex;
      justify-content: center;
      max-width: 960px;
      margin: 25px auto;
    }

    #viewer:fullscreen {
      width: 100%;
      height: 100%;
      max-width: none;
      margine: 0 !important;
      padding: 20px;
      box-sizing: border-box;
      background: #f6f2ec;
      align-items: center;
      transform: none !important;
    }

    #book {
      width: 100%;
      min-height: 600px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

      .controls[hidden] {
        display: none;
      }

    button {
      padding: 8px 14px;
      cursor: pointer;
      background: #fffcf8;
      color: #333;
      font-family: inherit;
      font-size: 14px;
      border: 1px solid #b8afa5;
      border-radius: 5px;
    }

      #page-slider {
        width: 220px;
        accent-color: #70485c;
        cursor: pointer;
      }

    #source {
      margin-top: 25px;
    }      
    </style>
    
  </head>

  <body>
    <h1 id="title"> Loading book...</h1>
    <p id="subtitle"></p>

    <div id="viewer">
      <div id="book"></div>
    </div>

    <div class="controls" id="controls" hidden>
      <button id="first">&laquo; First</button>
      <button id="previous">Previous</button>
      <span id="page-number"></span>
      <label for="page-slider">Page:</label>
      <input
        type="range"
        id="page-slider"
        min="1"
        value="1"
        step="1"
        >      
      <button id="next">Next</button>
      <button id="last">Last &raquo;</button>        
      <button id="zoom-out" title="Zoom out">-</button>
      <span id="zoom-level">100%</span>
      <button id="zoom-in" title = "Zoom in">+</button>
      <button id="fullscreen" title="Fullscreen">⛶</button>
      
    </div>

    <p id="source" hidden>
      <a id="source-link"
        target="_blank"
        rel="noopener noreferrer"></a>
    </p>

    <p id="status"></p>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

    <script>
      async function loadBook() {
        //read book name from url
        const params = new URLSearchParams(window.location.search);
        const bookPath = params.get("book");

        //Only accept folder names, not arbitrary URLS
        if (!bookPath || !/^[a-zA-Z0-9_-]+(?:\/[a-zA-Z0-9_-]+)*$/.test(bookPath)) {
          document.getElementById("title").textContent =
            "No book selected";
          return;
        }

        try {
          //Load this book's configuration
          const response = await fetch(bookPath + "/book.json");

          if (!response.ok) {
            throw new Error("Book configuration not found");
          }

          const config = await response.json();
          const count = Number(config.pageCount);

          if (!Number.isInteger(count) || count < 1) {
            throw new Error("Invalid page count");
          }

          //Display book information
          document.getElementById("title").textContent =
            config.title || "Flip Book";

          document.getElementById("subtitle").textContent =
            config.subtitle || "";

          document.title = config.title || "Flip Book";

          //optional external collection link
          if (config.sourceUrl && config.sourceLabel) {
            const link = document.getElementById("source-link");
            const url = new URL(config.sourceUrl);

            if (url.protocol === "https:" || url.protocol === "http:") {
              link.href = url.href;
              link.textContent = config.sourceLabel;
              document.getElementById("source").hidden = false;
            }
          }

          //Construct the page image filenames
          const images = [];

          for (let i = 1; i <= count; i++) {
            const number = String(i).padStart(3, "0");

            images.push(
              bookPath + "/" +
              config.imageFolder + "/" +
              config.imagePrefix + number +
              config.imageExtension
              );
          }

          //Initialise the flipbook
          const pageFlip = new St.PageFlip(
            document.getElementById("book"),
            {
              width: 450,
              height: 600,
              size: "stretch",
              minWidth: 200,
              maxWidth: 450,
              minHeight: 267,
              maxHeight: 600,
              showCover: config.showCover !== false,
              flippingTime: 700,
              drawShadow: true,
              usePortrait: true
            }
            );

          pageFlip.loadFromImages(images);

          //Navigation Buttons
          document.getElementById("previous").onclick = () =>
            pageFlip.flipPrev("bottom");

          document.getElementById("next").onclick = () =>
            pageFlip.flipNext("bottom");

          document.getElementById("first").onclick = () =>
            pageFlip.turnToPage(0);

          document.getElementById("last").onclick = () =>
            pageFlip.turnToPage(count - 1);

          //Page number display
          const pageNumber = document.getElementById("page-number");

          function updatePageNumber() {
            pageNumber.textContent =
              "Page " + (pageFlip.getCurrentPageIndex() + 1) +
              " of " + count;
            document.getElementById("page-slider").value = pageFlip.getCurrentPageIndex() + 1;
          }

          pageFlip.on("flip", updatePageNumber);
          updatePageNumber();

          //jump to a specific page
          const pageSlider = document.getElementById("page-slider");
          pageSlider.max = count;

          pageSlider.addEventListener("change", () =>
            {
              const page = Number(pageSlider.value);
              pageFlip.turnToPage(page - 1);
            });
          const viewer = 
            document.getElementById("viewer");
          const zoomLevel = 
            document.getElementById("zoom-level");

          let zoom = 1;

          function updateZoom(){
            viewer.style.transformOrigin = "top center";
            viewer.style.transform = `scale(${zoom})`;
            viewer.style.marginBottom = `${25 + Math.max(0, viewer.offsetHeight * (zoom - 1))}px`;

            zoomLevel.textContent = `${Math.round(zoom * 100)}%`;
          }

          document.getElementById("zoom-in").onclick = () => {
            zoom = Math.min(1.5, zoom + 0.1);
            updateZoom();
          };

          document.getElementById("zoom-out").onclick = () => {
            zoom = Math.max(0.8, zoom -0.1);
            updateZoom();
          };

          const fullscreenButton = 
            document.getElementById("fullscreen");

          fullscreenButton.onclick = async () => {
            if (document.fullscreenElement) {
              await document.exitFullscreen();
            } else {
              await viewer.requestFullscreen();
            }
          };

          
          document.getElementById("controls").hidden = false;
        } catch (error) {
          document.getElementById("status").textContent =
            "Unable to load this book: " + error.message;
        }
      }

      loadBook();
    </script>
    
        
  </body>
</html>
